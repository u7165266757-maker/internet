<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUTTO È VERO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <!-- Lo schermo del monitor: viene allineato in tempo reale al monitor 3D -->
  <div id="screen">
    <div id="os" class="off">
      <div id="desktop">
        <div id="icons"></div>
        <div id="wallmark">VALDINA OS 2.1</div>
      </div>
      <div id="windows"></div>
      <div id="notes"></div>
      <div id="taskbar">
        <div class="tb-start" id="tbStart">■ avvio</div>
        <div class="tb-tasks" id="tbTasks"></div>
        <div class="tb-tray">
          <span id="trayNet" class="tray-off">rete: assente</span>
          <span id="trayClock">--:--</span>
        </div>
      </div>
      <div id="osGlitch"></div>
    </div>
    <div id="riflesso"><div class="rf-vetro"></div><div class="rf-ombra"></div></div>
    <div id="crt"></div>
    <div id="bullet"></div>
  </div>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="flash"></div>
  <div id="hint"></div>
  <div id="subs"></div>

  <div id="boot">
    <div class="boot-in">
      <h1>TUTTO <span>È</span> VERO</h1>
      <p class="sub">un gioco in una stanza</p>
      <ul class="cmds">
        <li><b>mouse</b> — guardati attorno</li>
        <li><b>clic</b> — ti avvicini al computer</li>
        <li><b>ESC</b> — stacchi gli occhi dal monitor</li>
      </ul>
      <button id="bootBtn">ACCENDI IL MONITOR</button>
      <p class="warn">audio consigliato · luci spente</p>
    </div>
  </div>

  <div id="endcard"><div class="end-in"><div id="endTitle"></div><div id="endText"></div><button id="endBtn">RICOMINCIA</button></div></div>
</div>

<script src="js/three.min.js"></script>
<script>
// se la copia locale manca, si prova il CDN
if(!window.THREE){
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
}
</script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/nlu.js"></script>
<script src="js/people.js"></script>
<script src="js/world.js"></script>
<script src="js/os.js"></script>
<script src="js/app_mail.js"></script>
<script src="js/app_calls.js"></script>
<script src="js/app_chat.js"></script>
<script src="js/app_net.js"></script>
<script src="js/police.js"></script>
<script src="js/endings.js"></script>
<script src="js/director.js"></script>
<script src="js/main.js"></script>
</body>
</html>
